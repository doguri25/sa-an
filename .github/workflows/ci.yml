name: Validate and build

on:
  push:
    branches: [main, chore/display-settings-publish]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate and build
        shell: bash
        run: |
          if [ -f package.json ]; then
            npm test
            npm run build
          else
            node -e "const fs=require('fs');const vm=require('vm');const html=fs.readFileSync('index.html','utf8');for(const m of html.matchAll(/<script\b[^>]*>([\s\S]*?)<\/script>/gi)){if(m[1].trim())new vm.Script(m[1]);}console.log('Inline JavaScript syntax OK');"
            mkdir -p dist
            cp index.html manifest.webmanifest sw.js icon-192.png icon-512.png dist/
          fi
      - name: Upload static site
        uses: actions/upload-artifact@v4
        with:
          name: sa-an-site
          path: dist/
          retention-days: 7
      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: sa-an-source
          path: |
            index.html
            manifest.webmanifest
            sw.js
            icon-192.png
            icon-512.png
            package.json
            README.md
            CHANGELOG.md
            vercel.json
            scripts/
            assets/
            tests/
          retention-days: 7
