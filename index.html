:root{--font:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;--r:6px;--toast-b:76px}
html[data-font=maple]{--font:"MaplestoryOTF","Noto Sans KR",sans-serif}

html[data-font=serif]{--font:"Apple Myungjo","Nanum Myeongjo","Noto Serif KR","Batang","BatangChe",serif}
html[data-hpos=bottom] #app{grid-template-rows:1fr auto auto;grid-template-areas:"main" "top" "tabs"}
html[data-hpos=bottom] .top{border-bottom:0;border-top:1px solid var(--line)}
html[data-hpos=bottom]{--toast-b:136px}
html[data-theme=paper]{--paper:#F3F5F7;--surface:#FFFFFF;--surface2:#FBFCFD;--ink:#22303C;--ink2:#62717E;--line:#D8DEE4;--line2:#EBEFF2;--seal:#3C5A7D;--seal-soft:#E7EDF4;--seal-ink:#2C4562;--amber:#A8792A;--amber-soft:#F7EEDA;--red:#A9463F;--red-soft:#F6E4E2;--green:#4B7A5F;--green-soft:#E1EEE6;--stage:#E9EEF3}
html[data-theme=night]{--paper:#171B20;--surface:#20262D;--surface2:#242B33;--ink:#E6EAEE;--ink2:#9AA6B2;--line:#343C46;--line2:#2B333B;--seal:#7FA3CC;--seal-soft:#28374A;--seal-ink:#5E86B0;--amber:#D9A94A;--amber-soft:#3E3423;--red:#E07A72;--red-soft:#472A28;--green:#7DB894;--green-soft:#243A2D;--stage:#1C2228}
html[data-theme=board]{--paper:#E9EFE9;--surface:#F7FAF7;--surface2:#F1F5F1;--ink:#1F2E27;--ink2:#5C6E64;--line:#CFDBD3;--line2:#E1E9E3;--seal:#2F6B57;--seal-soft:#DDEDE5;--seal-ink:#245546;--amber:#9C7A2C;--amber-soft:#F3EBD4;--red:#A64B44;--red-soft:#F4E2E0;--green:#3F7A4E;--green-soft:#DDEEE0;--stage:#DCE7DF}

*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea,select{font:inherit;color:inherit;font-size:16px}
#app{height:100dvh;display:grid;grid-template-rows:auto 1fr auto;grid-template-columns:minmax(0,1fr);grid-template-areas:"top" "main" "tabs"}
#app>*{min-width:0}
.top>div{min-width:0;overflow:hidden}
.top{grid-area:top;background:var(--surface);border-bottom:1px solid var(--line);padding:8px 12px;display:flex;align-items:center;gap:10px}
.top .date{font-weight:700;font-size:15px;line-height:1.2}
.top .tag{font-size:11px;color:var(--ink2);line-height:1.3}
.top .tag .slots i{width:7px;height:7px}
.top .mini{display:flex;gap:8px;font-size:11px;color:var(--ink2);margin-left:auto;white-space:nowrap}
.top .mini b{color:var(--ink)}
.back{background:none;border:1px solid var(--line);border-radius:var(--r);padding:4px 8px;font-size:12px;color:var(--ink2);white-space:nowrap}
.back:disabled{opacity:.35}
.pcback{display:none}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;font-size:11px;text-align:center}
.cal .d{padding:4px 2px;border-radius:4px;min-height:34px;background:var(--surface2);border:1px solid var(--line2)}
.cal .d.today{background:var(--amber-soft);border-color:var(--amber);font-weight:700}
.cal .d.wk{opacity:.55}
.cal .d.m{border-color:var(--seal)}
.cal .d small{display:block;font-size:9px;color:var(--seal);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal .d small.red{color:var(--red)}
.cont{background:var(--seal);color:#fff;border:0;border-radius:var(--r);padding:8px 12px;font-weight:700;display:inline-flex;align-items:center;gap:6px;box-shadow:0 2px 0 var(--seal-ink);white-space:nowrap}
.cont small{font-weight:400;opacity:.85}
.cont:disabled{opacity:.5;box-shadow:none}
.side{display:none}
main{grid-area:main;min-height:0;position:relative;overflow:hidden}
main.scroll{overflow-y:auto;-webkit-overflow-scrolling:touch}
#fit{padding:10px 12px 14px;max-width:980px;margin:0 auto;transform-origin:top left}
.status{display:none}
.tabs{grid-area:tabs;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:4px 4px calc(4px + env(safe-area-inset-bottom))}
.tabs button{background:none;border:0;padding:4px 2px;font-size:11px;color:var(--ink2);display:flex;flex-direction:column;align-items:center;gap:2px;border-radius:var(--r);position:relative}
.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button.on{color:var(--seal);font-weight:700}
.n{background:var(--red);color:#fff;font-size:10px;border-radius:999px;padding:0 5px;line-height:15px}
.tabs .n{position:absolute;top:0;right:18%}
/* primitives */
h1{font-size:18px;margin:2px 0 8px;font-weight:700}
h1 .no{font-weight:400;font-size:12px;color:var(--ink2);margin-left:8px}
h2{font-size:14px;margin:12px 0 6px;font-weight:700}
h2 span{font-weight:400;color:var(--ink2);font-size:12px;margin-left:6px}
.doc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.doc+.doc{margin-top:8px}
.hd{padding:8px 12px;border-bottom:1px solid var(--line2);display:flex;align-items:center;gap:8px}
.bd{padding:10px 12px}
.no{font-size:12px;color:var(--ink2)}
.stamp{display:inline-block;border:2px solid var(--seal);color:var(--seal);border-radius:4px;padding:0 6px;font-size:11px;font-weight:700;letter-spacing:.06em;transform:rotate(-3deg);background:var(--surface)}
.stamp.red{border-color:var(--red);color:var(--red)}.stamp.green{border-color:var(--green);color:var(--green)}.stamp.gray{border-color:var(--ink2);color:var(--ink2)}.stamp.amber{border-color:var(--amber);color:var(--amber)}
.chip{display:inline-block;font-size:11px;padding:1px 7px;border-radius:999px;background:var(--line2);color:var(--ink2);white-space:nowrap}
.chip.seal{background:var(--seal-soft);color:var(--seal)}.chip.amber{background:var(--amber-soft);color:var(--amber)}.chip.red{background:var(--red-soft);color:var(--red)}.chip.green{background:var(--green-soft);color:var(--green)}
.row{display:flex;align-items:center;gap:8px}.grow{flex:1;min-width:0}.wrap{flex-wrap:wrap}
.btn{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:6px 11px;font-weight:500;font-size:14px}
.btn.primary{background:var(--seal);border-color:var(--seal);color:#fff}
.btn.ghost{border-color:transparent;color:var(--seal);background:transparent}
.btn.sm{padding:4px 8px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btns{display:flex;gap:6px;flex-wrap:wrap}
.list{list-style:none;margin:0;padding:0}
.list li{padding:8px 12px;border-top:1px solid var(--line2);display:flex;gap:8px;align-items:flex-start}
.list li:first-child{border-top:0}
.list .t{font-weight:500;font-size:14px}.list .s{font-size:12px;color:var(--ink2)}
.due{font-size:12px;font-weight:700;white-space:nowrap}.due.red{color:var(--red)}.due.amber{color:var(--amber)}.due.ok{color:var(--green)}
.bar{height:6px;background:var(--line2);border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;background:var(--seal)}.bar.amber i{background:var(--amber)}.bar.red i{background:var(--red)}.bar.green i{background:var(--green)}
.slots{display:inline-flex;gap:3px;vertical-align:middle}.slots i{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--seal);display:inline-block}.slots i.f{background:var(--seal)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (max-width:640px){.grid2{grid-template-columns:1fr}}
.kv{display:grid;grid-template-columns:78px 1fr;gap:3px 8px;font-size:13px;margin:0}.kv dt{color:var(--ink2)}.kv dd{margin:0}
.field{border:1px solid var(--line);border-radius:var(--r);padding:7px 9px;background:var(--surface2)}
.field .lb{font-size:11px;color:var(--ink2);margin-bottom:3px}
.evchip{font-size:11px;border:1px dashed var(--seal);color:var(--seal);border-radius:999px;padding:0 7px;background:var(--surface);display:inline-block;margin:2px 2px 0 0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;flex-wrap:wrap}
.seg button{background:var(--surface);border:0;padding:4px 9px;font-size:12px;border-left:1px solid var(--line)}
.seg button:first-child{border-left:0}.seg button.on{background:var(--seal);color:#fff}
textarea,input[type=text],input[type=password],select{width:100%;border:1px solid var(--line);border-radius:var(--r);padding:7px 9px;background:var(--surface);color:var(--ink)}
textarea{min-height:60px;resize:vertical}
.clock{position:relative;height:50px;margin:4px 4px 0}
.clock .rail{position:absolute;left:0;right:0;top:22px;height:4px;background:var(--line);border-radius:2px}
.clock .fill{position:absolute;left:0;top:22px;height:4px;background:var(--seal);border-radius:2px}
.clock .mk{position:absolute;top:14px;transform:translateX(-50%);text-align:center;font-size:10px;color:var(--ink2);white-space:nowrap}
.clock .mk i{display:block;width:10px;height:10px;border-radius:50%;background:var(--surface);border:2px solid var(--line);margin:0 auto 3px}
.clock .mk.done i{border-color:var(--seal);background:var(--seal)}
.clock .mk.now i{border-color:var(--amber);background:var(--amber);box-shadow:0 0 0 4px var(--amber-soft)}.clock .mk.now{color:var(--amber);font-weight:700}
.clock .mk.red{color:var(--red)}.clock .mk.red i{border-color:var(--red)}
.clock .mk.lo{top:-1px;display:flex;flex-direction:column-reverse;align-items:center}.clock .mk.lo i{margin:3px auto 0}
.clock .mk.start{transform:translateX(-8%)}.clock .mk.end{transform:translateX(-92%)}
.steps{display:flex;gap:2px;margin-top:6px}.steps b{flex:1;height:7px;border-radius:2px;background:var(--line2)}.steps b.d{background:var(--seal)}.steps b.c{background:var(--amber)}
.steps-lb{display:flex;justify-content:space-between;font-size:10px;color:var(--ink2);margin-top:3px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px;text-align:center;cursor:pointer}
.pcard .por{width:78px;height:86px;margin:0 auto 4px;border-radius:8px;background:var(--seal-soft);overflow:hidden}
.pcard .nm{font-weight:700;font-size:14px}.pcard .rl{font-size:11px;color:var(--ink2)}.pcard .tr{font-size:10px;color:var(--ink2);margin-top:2px}
.por svg{width:100%;height:100%;display:block}
.iv{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.iv .stage{background:var(--stage);padding:10px 12px;display:flex;gap:12px;align-items:flex-end}
.iv .big{width:118px;height:130px;border-radius:10px;background:var(--surface);overflow:hidden;flex:none;border:1px solid var(--line)}
.iv .big svg{width:100%;height:100%;display:block}
.iv .who .nm{font-weight:700;font-size:15px}.iv .who .rl{font-size:11px;color:var(--ink2)}
.gauge{margin-top:6px;font-size:11px;color:var(--ink2)}.gauge .bar{margin-top:2px}
.iv .say{padding:10px 12px;font-size:14px;border-top:1px solid var(--line2);border-bottom:1px solid var(--line2);background:var(--surface2);min-height:52px}
.iv .say .sp{font-size:11px;color:var(--ink2);margin-bottom:1px}
.qs{padding:8px 12px;display:grid;gap:5px}
.q{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:7px 10px;text-align:left;display:flex;gap:7px;font-size:13px;color:var(--ink)}
.q em{font-style:normal;color:var(--seal);font-weight:700;flex:none}
.q:disabled{opacity:.45}
.free{margin:2px 12px 10px;border:1px dashed var(--seal);border-radius:var(--r);padding:6px 8px;display:flex;gap:6px;align-items:center;background:var(--surface2)}
.free input{flex:1;border:0;background:transparent;font:inherit;outline:0;min-width:0;padding:2px}
.free .cnt{font-size:10px;color:var(--ink2);white-space:nowrap}
.file{display:flex;gap:10px;align-items:center}
.file .cv{width:36px;height:46px;border:1px solid var(--line);border-radius:3px;background:var(--surface2);position:relative;flex:none}
.file .cv:after{content:"";position:absolute;left:6px;right:6px;top:10px;height:2px;background:var(--seal);box-shadow:0 5px 0 var(--line),0 10px 0 var(--line),0 15px 0 var(--line)}
.grade{font-size:22px;font-weight:700;color:var(--seal);width:32px;text-align:center}
.stat{display:grid;grid-template-columns:76px 1fr 40px;gap:6px;align-items:center;font-size:12px;padding:3px 0}
.note{font-size:12px;color:var(--ink2);margin-top:6px}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cmp .doc .hd{font-weight:700}
.truth li{padding:5px 12px;font-size:13px;display:block}
.lie{color:var(--red)}
input,textarea,select,.selectable,.mailpanel .body,#print,#print *{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
button,.btn,.q,.tabs,.side,.pcard,.doc .hd{-webkit-user-select:none;user-select:none}
.iv .say{white-space:pre-line}
.agrp .btn{display:inline-flex;align-items:center;gap:6px;text-align:left}.agrp .btn .cost{margin-left:auto;flex:none}
.q .qt{flex:1;min-width:0}
.qlb{font-size:11px;color:var(--ink2);margin:6px 0 2px;letter-spacing:.04em}.q.fu{border-left:3px solid var(--seal)}
.btn .cost{font-style:normal;font-size:10px;margin-left:6px;padding:1px 5px;border-radius:8px;background:var(--seal-soft);color:var(--seal);vertical-align:1px;white-space:nowrap}.btn .cost.free{background:var(--surface2);color:var(--ink2)}.btn .cost.pick{background:#fff3d6;color:#8a5a00}.btn.primary .cost{background:rgba(255,255,255,.22);color:#fff}.btn.primary .cost.free{color:#fff}
.csbox{display:grid;gap:8px;font-size:14px}.csn{font-size:11px;color:var(--ink2);letter-spacing:.03em}.cs{display:grid;grid-template-columns:minmax(72px,auto) 1fr;gap:8px;align-items:start}.cs b{font-size:12px;color:var(--seal);padding-top:2px;white-space:nowrap;max-width:120px;overflow:hidden;text-overflow:ellipsis}.cs>span{background:var(--surface2);border-radius:10px;padding:8px 10px;line-height:1.4}.cs span.nm{background:none;padding:0;border-radius:0}.cs.nar b{color:var(--ink2)}.cs.nar>span{background:none;padding:2px 0;color:var(--ink2);font-style:italic}
.disc{margin:0;padding:6px 12px 6px 30px;font-size:13px}.disc li{padding:5px 0;border-bottom:1px solid var(--line2)}.disc li:last-child{border:0}
.qrbox{margin-top:8px;display:grid;justify-items:start;gap:6px}.qrbox svg{width:150px;height:150px;background:#fff;border:1px solid var(--line);border-radius:6px;padding:4px}
.nb .nbd{background:var(--surface2);padding:4px 12px;font-size:12px}
.nb .nbi{align-items:flex-start}
.board{display:grid;gap:12px}.bcol.on{border-color:var(--seal)}
.tbl{width:100%;border-collapse:collapse;font-size:12px}.tbl th,.tbl td{border-bottom:1px solid var(--line2);padding:4px 6px;text-align:left}.tbl th{color:var(--ink2);font-weight:500}
.mailpanel{margin-top:12px;border:1px solid var(--line);border-left:4px solid var(--seal);border-radius:8px;padding:8px 10px;background:var(--surface2)}
.mailpanel .meta{font-size:11px;color:var(--ink2);margin:4px 0}.mailpanel .body{font-size:13px;white-space:pre-wrap;max-height:220px;overflow:auto;margin-bottom:6px}
.agrp{margin-bottom:8px}.agrp:last-child{margin-bottom:0}.alb{font-size:11px;color:var(--ink2);letter-spacing:.04em;margin:2px 0 4px}
.cols,.colA,.colB{min-width:0}
.ivcols{display:block}
.mini-cases button{display:block;width:100%;text-align:left;background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:6px 8px;margin-bottom:4px;font-size:12px;color:var(--ink)}
.mini-cases button.on{border-color:var(--seal);background:var(--seal-soft)}.mini-cases small{color:var(--ink2)}
.mini-mail div{font-size:12px;padding:4px 0;border-top:1px solid var(--line2);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mini-mail div.unread{font-weight:700}
.ms{margin:6px 0 4px}

.msbar i{display:block;height:100%;background:var(--seal);border-radius:3px}
.msbar b{position:absolute;top:-4px;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:var(--surface);border:3px solid var(--seal)}
.msbar b span{position:absolute;top:-20px;left:50%;transform:translateX(-50%);font-size:10px;font-weight:700;color:var(--seal);white-space:nowrap}
.ms ul{list-style:none;margin:0;padding:0}

.ms li i{width:10px;height:10px;border-radius:50%;border:2px solid var(--line);background:var(--surface);flex:none}
.ms li.done i{background:var(--seal);border-color:var(--seal)}

.ms li.late i{border-color:var(--red);background:var(--red)}

.ms li .st{font-size:12px;color:var(--ink2)}.ms li.done .st{color:var(--green)}.ms li.late .st{color:var(--red);font-weight:700}.ms li.today .st{color:var(--amber);font-weight:700}
.seg button{white-space:nowrap}
.list.settings li{flex-wrap:wrap;gap:6px}
.list.settings li>.seg,.list.settings li>.btns,.list.settings li>.btn{flex-basis:100%;justify-content:flex-start}
.list.settings .seg{max-width:100%;overflow-x:auto}

#pop{position:relative}
.seg{max-width:100%}
.btn{min-height:38px}
.tabs button{min-height:44px}
.btn.noslot,.btn[disabled]{opacity:.45;cursor:not-allowed}
.pcard.noslot{opacity:.5}

span.nm{white-space:nowrap}
.iv .who{min-width:0;flex:1 1 auto}
.iv .who .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

#modal .box{background:var(--surface);border-radius:10px;width:100%;max-width:520px;max-height:90dvh;overflow:auto;padding:14px 16px}
#modal h3{margin:0 0 8px;font-size:16px}
#modal .opts{display:grid;gap:6px;margin-top:10px}
#modal .opts button{text-align:left;padding:9px 11px}
#modal .opts button small{display:block;color:var(--ink2);font-weight:400;font-size:12px}
#modal .opts button.primary small{color:rgba(255,255,255,.85)}
#popwrap{position:fixed;inset:0;z-index:55;display:none;align-items:center;justify-content:center;background:rgba(20,28,36,0);transition:background .25s ease;pointer-events:none}
#popwrap.on{display:flex;background:rgba(20,28,36,.45);pointer-events:auto}
#pop{transform:translateY(16px) scale(.94);opacity:0;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-top:4px solid var(--seal);border-radius:12px;padding:12px 14px;width:min(92vw,440px);max-height:80dvh;overflow:auto;box-shadow:0 14px 40px rgba(0,0,0,.28);transition:opacity .25s cubic-bezier(.2,.8,.2,1),transform .25s cubic-bezier(.2,.8,.2,1)}
#popwrap.on #pop{opacity:1;transform:none}
#pop .body{font-size:14px;margin:6px 0 4px;white-space:pre-wrap}
#pop .meta{font-size:11px;color:var(--ink2)}
#pop .t{font-weight:700;font-size:13px;margin-bottom:4px}
#pop .it{font-size:12px;color:var(--ink2);padding:2px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#pop .btns{margin-top:6px}
@media (prefers-reduced-motion:reduce){#pop{transition:none}}
#toast{z-index:70;position:fixed;left:50%;bottom:var(--toast-b);transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 14px;border-radius:999px;font-size:13px;display:none;z-index:60;max-width:92vw;text-align:center}
.start{max-width:520px;margin:6vh auto 0;text-align:center}
.start h1{font-size:30px;margin:0}
.start p{color:var(--ink2)}
.start .doc{text-align:left}
.themes{display:flex;gap:6px;flex-wrap:wrap}
.themes button{border:2px solid var(--line);border-radius:8px;padding:6px 10px;font-size:12px;background:var(--surface)}
.themes button.on{border-color:var(--seal)}
.themes .sw{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:-2px;margin-right:4px;border:1px solid rgba(0,0,0,.15)}
.mini-list{max-height:none}
/* desktop */
@media (min-width:900px){
  html{--toast-b:28px}
  #app{grid-template-columns:208px 1fr 236px;grid-template-rows:1fr;grid-template-areas:"side main status"}
  .top,.tabs{display:none}
  .pcback{display:inline-block;margin-bottom:8px}
  .side{display:flex;flex-direction:column;grid-area:side;background:var(--surface);border-right:1px solid var(--line);padding:16px 10px;overflow:hidden}
  .side .logo{padding:4px 10px 12px;border-bottom:1px solid var(--line2);margin-bottom:8px}
  .side .logo b{font-size:19px;display:block}.side .logo span{font-size:12px;color:var(--ink2)}
  .side button{background:none;border:0;text-align:left;padding:8px 10px;border-radius:var(--r);display:flex;align-items:center;gap:10px;font-size:14px;color:var(--ink)}
  .side button svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;color:var(--ink2)}
  .side button.on{background:var(--seal-soft);color:var(--seal);font-weight:700}.side button.on svg{color:var(--seal)}
  .side .n{margin-left:auto}
  .side .foot{margin-top:auto;font-size:11px;color:var(--ink2);padding:8px 10px}
  #fit{padding:20px 24px}
  .status{display:block;grid-area:status;background:var(--surface);border-left:1px solid var(--line);padding:16px 14px 40px;overflow-y:auto;position:relative}
  .status .today{font-size:12px;color:var(--ink2)}.status .date{font-size:20px;font-weight:700}
  .status .cont{width:100%;justify-content:center;padding:11px;font-size:15px;margin:10px 0 14px}
  .status h3{font-size:12px;color:var(--ink2);margin:12px 0 5px;font-weight:500}
  .trust{display:grid;grid-template-columns:48px 1fr 28px;gap:5px 8px;align-items:center;font-size:12px}
  .status .foot{position:absolute;bottom:12px;left:14px;right:14px;font-size:11px;color:var(--ink2)}
  .iv .big{width:150px;height:166px}
  #fit{padding:20px 28px;max-width:1280px}
  .cols{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:18px;align-items:start}
  .cols>.colB>h2:first-child{margin-top:0}
  .ivcols{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,3fr)}
  .ivcols .ivL{border-right:1px solid var(--line)}
  .ivcols .stage{align-items:flex-start}
  .ivcols .say{min-height:120px}
  .grid2{grid-template-columns:repeat(3,minmax(0,1fr))}
  .pgrid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
  .cmp{grid-template-columns:1fr 1fr}
  .list.settings li{flex-wrap:nowrap}.list.settings li>.seg,.list.settings li>.btns,.list.settings li>.btn{flex-basis:auto;margin-left:auto}
  h1{font-size:24px}
}
@media (min-width:1500px){#app{grid-template-columns:230px 1fr 280px}.cols{gap:24px}}
@media print{body{overflow:visible;height:auto}#app,#toast,#modal{display:none!important}#print{display:block!important;padding:20px;font-family:var(--font);color:#000}}
#print{display:none}
</style>
</head>

  <nav class="tabs" id="tabs"></nav>
</div>
<div id="modal"><div class="box" id="mbox"></div></div>
<div id="toast"></div><div id="popwrap"><div id="pop"></div></div>

const SKIN=['#F6DCCB','#F0CDB1','#E5B896','#D5A07C','#BC8663'];
const HAIRC=['#26221F','#3A2A22','#54392A','#6E4C33','#8C6B4F'];
const CLOTH={k:['#5A7FB1','#C96C5A','#7BA36B','#E0B25A','#8B79B8'],p:['#3D4B5C','#8A6A57','#5B6E5C','#6F5F8A','#9A6E6E'],t:['#4C6E8F','#6B7F73','#7E6A57','#5E5E7A'],o:['#2E4B6E','#4E4E4E']};
function portrait(c,style,mood){
  const r=rng(c.seed);const pick=a=>a[Math.floor(r()*a.length)];
  const adult=c.adult,fem=c.female;
  const skin=pick(SKIN),hair=c.hair||(c.older?'#6E6A66':pick(HAIRC)),cloth=pick(CLOTH[c.kind]||CLOTH.k);
  const faceW=adult?34:38,faceH=adult?44:38,eyeY=adult?-4:2,eyeR=adult?2.6:3.6,eyeGap=adult?12:13;
  const hs=c.hairStyle!=null?c.hairStyle:Math.floor(r()*(fem?4:3));
  const glasses=c.glasses!=null?c.glasses:(adult&&r()<.4);
  const flat=style==='flat';
  const st=flat?'stroke="#22303C" stroke-width="2.2" stroke-linejoin="round"':'stroke="rgba(0,0,0,.18)" stroke-width="1"';
  const id='g'+c.seed;
  const defs=flat?'':`<defs><radialGradient id="${id}s" cx="45%" cy="38%" r="70%"><stop offset="0" stop-color="#fff" stop-opacity=".35"/><stop offset="1" stop-color="#000" stop-opacity=".12"/></radialGradient><linearGradient id="${id}h" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset="1" stop-color="#000" stop-opacity=".25"/></linearGradient></defs>`;
  const shade=flat?'':`<ellipse cx="0" cy="0" rx="${faceW}" ry="${faceH}" fill="url(#${id}s)"/>`;
  let hairBack='';
  if(fem&&(hs===0||hs===1))hairBack=`<path d="M-${faceW+5},-6 C-${faceW+9},28 -${faceW+3},58 -${faceW-5},72 L${faceW-5},72 C${faceW+3},58 ${faceW+9},28 ${faceW+5},-6 Z" fill="${hair}" ${st}/>`;
  if(fem&&hs===3)hairBack=`<path d="M${faceW-6},-${faceH*0.5} C${faceW+18},-${faceH*0.2} ${faceW+16},40 ${faceW+2},62 C${faceW-4},50 ${faceW-2},20 ${faceW-8},-${faceH*0.1} Z" fill="${hair}" ${st}/><circle cx="${faceW+2}" cy="-${faceH*0.45}" r="5" fill="${hair}" ${st}/>`;
  const top=-faceH-9, tw=faceW+3;
  const crown=`M-${tw},${-faceH*0.28} C-${tw+2},${top} ${tw+2},${top} ${tw},${-faceH*0.28}`;
  const recede=(adult&&!fem&&c.older)?0.72:0.6;
  let hf;
  if(hs===0)      hf=`<path d="${crown} C${tw-2},${-faceH*0.55} ${faceW-14},${-faceH*0.62} ${faceW-18},${-faceH*0.66} C${faceW-24},${-faceH*0.78} -4,${-faceH*0.8} -${faceW-2},${-faceH*0.5} C-${tw-1},${-faceH*0.42} -${tw},${-faceH*0.32} -${tw},${-faceH*0.28} Z" fill="${hair}" ${st}/>`; // 옆가르마+앞머리
  else if(hs===1) hf=`<path d="${crown} C${tw},${-faceH*0.5} ${faceW-3},${-faceH*0.52} ${faceW-6},${-faceH*0.5} L${faceW-8},${-faceH*0.72} C${faceW*0.3},${-faceH*0.8} -${faceW*0.3},${-faceH*0.8} -${faceW-8},${-faceH*0.72} L-${faceW-6},${-faceH*0.5} C-${faceW-3},${-faceH*0.52} -${tw},${-faceH*0.5} -${tw},${-faceH*0.28} Z" fill="${hair}" ${st}/>`; // 일자 앞머리
  else            hf=`<path d="${crown} C${tw},${-faceH*0.5} ${faceW-4},${-faceH*recede} ${faceW*0.55},${-faceH*(recede+0.06)} C${faceW*0.2},${-faceH*(recede+0.1)} -${faceW*0.2},${-faceH*(recede+0.1)} -${faceW*0.55},${-faceH*(recede+0.06)} C-${faceW-4},${-faceH*recede} -${tw},${-faceH*0.5} -${tw},${-faceH*0.28} Z" fill="${hair}" ${st}/>`; // 짧고 단정(이마 보임)
  const hfs=flat?'':hf.replace(`fill="${hair}"`,`fill="url(#${id}h)"`).replace(st,'stroke="none"');
  const dx=mood==='avoid'?1.6:0;
  const eye=x=>`<ellipse cx="${x}" cy="${eyeY}" rx="${eyeR*1.35}" ry="${eyeR*1.1}" fill="#fff" ${flat?'stroke="#22303C" stroke-width="1.6"':'stroke="rgba(0,0,0,.25)" stroke-width=".8"'}/><circle cx="${x+dx}" cy="${eyeY+0.4}" r="${eyeR*0.75}" fill="#2E2A27"/>${flat?'':`<circle cx="${x+dx-0.8}" cy="${eyeY-0.8}" r="${eyeR*0.22}" fill="#fff"/>`}`;
  const eyes=eye(-eyeGap)+eye(eyeGap);
  const bw=flat?2.4:2,by=eyeY-(adult?9:8);let brows;
  if(mood==='angry')brows=`<path d="M-${eyeGap+6},${by-2} L-${eyeGap-5},${by+2}" stroke="${hair}" stroke-width="${bw}" fill="none" stroke-linecap="round"/><path d="M${eyeGap-5},${by+2} L${eyeGap+6},${by-2}" stroke="${hair}" stroke-width="${bw}" fill="none" stroke-linecap="round"/>`;
  else if(mood==='tears'||mood==='tense')brows=`<path d="M-${eyeGap+6},${by+1} Q-${eyeGap},${by-3} -${eyeGap-5},${by+0.5}" stroke="${hair}" stroke-width="${bw}" fill="none" stroke-linecap="round"/><path d="M${eyeGap-5},${by+0.5} Q${eyeGap},${by-3} ${eyeGap+6},${by+1}" stroke="${hair}" stroke-width="${bw}" fill="none" stroke-linecap="round"/>`;
  else brows=`<path d="M-${eyeGap+6},${by} Q-${eyeGap},${by-2.5} -${eyeGap-5},${by}" stroke="${hair}" stroke-width="${bw}" fill="none" stroke-linecap="round"/><path d="M${eyeGap-5},${by} Q${eyeGap},${by-2.5} ${eyeGap+6},${by}" stroke="${hair}" stroke-width="${bw}" fill="none" stroke-linecap="round"/>`;
  const my=adult?18:16;let mouth;
  if(mood==='smile')mouth=`<path d="M-5,${my} Q0,${my+4} 5,${my}" stroke="#7A3F3A" stroke-width="1.6" fill="none" stroke-linecap="round"/>`;
  else if(mood==='angry')mouth=`<path d="M-5,${my+2} Q0,${my-1} 5,${my+2}" stroke="#7A3F3A" stroke-width="1.6" fill="none" stroke-linecap="round"/>`;
  else if(mood==='tears')mouth=`<path d="M-4.5,${my+1.5} Q0,${my} 4.5,${my+1.5}" stroke="#7A3F3A" stroke-width="1.6" fill="none" stroke-linecap="round"/><path d="M-${eyeGap-1},${eyeY+6} q-2,6 0,10 q2,-4 0,-10" fill="#7FB0DA"/><path d="M${eyeGap+1},${eyeY+6} q2,6 0,10 q-2,-4 0,-10" fill="#7FB0DA"/>`;
  else if(mood==='tense')mouth=`<path d="M-4.5,${my+1} L4.5,${my+1}" stroke="#7A3F3A" stroke-width="1.6" fill="none" stroke-linecap="round"/><path d="M${faceW-6},${eyeY-4} q3,6 0,10 q-3,-4 0,-10" fill="#9CC5E8"/>`;
  else mouth=`<path d="M-4.5,${my} Q0,${my+2} 4.5,${my}" stroke="#7A3F3A" stroke-width="1.6" fill="none" stroke-linecap="round"/>`;
  const nose=`<path d="M-1,${eyeY+4} q-2,6 1,8" stroke="${flat?'#22303C':'rgba(0,0,0,.28)'}" stroke-width="${flat?1.6:1.2}" fill="none" stroke-linecap="round"/>`;
  const ears=`<ellipse cx="-${faceW}" cy="${eyeY+3}" rx="4" ry="6" fill="${skin}" ${st}/><ellipse cx="${faceW}" cy="${eyeY+3}" rx="4" ry="6" fill="${skin}" ${st}/>`;
  const gl=glasses?`<g fill="none" stroke="${flat?'#22303C':'#4A4A4A'}" stroke-width="1.6"><rect x="-${eyeGap+8}" y="${eyeY-6}" width="15" height="12" rx="3"/><rect x="${eyeGap-7}" y="${eyeY-6}" width="15" height="12" rx="3"/><path d="M-${eyeGap-7},${eyeY} h${(eyeGap-7)*2}"/></g>`:'';
  const beard=(adult&&!fem&&c.beard)?`<path d="M-${faceW-4},${my-6} C-${faceW-6},${faceH-4} -14,${faceH+1} 0,${faceH+1} C14,${faceH+1} ${faceW-6},${faceH-4} ${faceW-4},${my-6} C${faceW-12},${my+4} 10,${my+8} 0,${my+8} C-10,${my+8} -${faceW-12},${my+4} -${faceW-4},${my-6} Z" fill="${hair}" opacity=".5"/>`:'';
  const age=(adult&&c.older)?`<path d="M-${eyeGap+3},${eyeY+7} q3,2 7,0" stroke="rgba(0,0,0,.14)" stroke-width="1" fill="none"/><path d="M${eyeGap-4},${eyeY+7} q4,2 7,0" stroke="rgba(0,0,0,.14)" stroke-width="1" fill="none"/><path d="M-${faceW-6},${my-2} q3,6 8,8" stroke="rgba(0,0,0,.1)" stroke-width="1" fill="none"/><path d="M${faceW-6},${my-2} q-3,6 -8,8" stroke="rgba(0,0,0,.1)" stroke-width="1" fill="none"/>`:'';
  const body=`<path d="M-${faceW+22},96 C-${faceW+22},64 -20,58 -14,50 L14,50 C20,58 ${faceW+22},64 ${faceW+22},96 Z" fill="${cloth}" ${st}/><path d="M-9,${faceH-6} h18 v14 h-18z" fill="${skin}" ${st}/>`;
  const collar=(c.kind==='t'||c.kind==='o')?`<path d="M-14,50 L0,64 L14,50" fill="none" stroke="rgba(255,255,255,.7)" stroke-width="2"/>`:'';
  return `<svg viewBox="-60 -70 120 166" xmlns="http://www.w3.org/2000/svg">${defs}<g>${hairBack}${body}${collar}${ears}<ellipse cx="0" cy="0" rx="${faceW}" ry="${faceH}" fill="${skin}" ${st}/>${shade}${age}${brows}${eyes}${nose}${mouth}${beard}${gl}${hf}${hfs}</g></svg>`;
}

const HUE={P:212,PP:212,S:12,SP:12,S2:345,SP2:345,W:140,T:280,T2:300,CK:36,EX:36,HN:172,OT:250,VP:330,PR:320,CO:172,NU:190};
function nameColor(id){const h=HUE[id]??200;const night=DEF.theme==='night';const parent=id==='PP'||id==='SP'||id==='SP2';return `hsl(${h+(parent?14:0)} ${parent?40:58}% ${night?(parent?72:64):(parent?30:38)}%)`}
function colorizeNames(root){
  if(!G||!root||!G.case)return;const ch=Object.assign({},G.staff||{},G.case.chars);const names=Object.keys(ch).map(id=>[ch[id].name,id]).sort((a,b)=>b[0].length-a[0].length);
  const re=new RegExp('('+names.map(n=>n[0].replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')','g');const map=Object.fromEntries(names);
  const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>{const p=n.parentElement;if(!p||p.closest('input,textarea,select,option,script,style,.nm,svg'))return NodeFilter.FILTER_REJECT;re.lastIndex=0;return re.test(n.nodeValue)?NodeFilter.FILTER_ACCEPT:NodeFilter.FILTER_SKIP}});
  const nodes=[];let n;while(n=walker.nextNode())nodes.push(n);
  nodes.forEach(node=>{const frag=document.createDocumentFragment();node.nodeValue.split(re).forEach(part=>{if(map[part]!=null){const sp=document.createElement('span');sp.className='nm';sp.style.color=nameColor(map[part]);sp.style.fontWeight='700';sp.textContent=part;frag.appendChild(sp)}else if(part)frag.appendChild(document.createTextNode(part))});node.parentNode.replaceChild(frag,node)});
}

/* ---------- 인물 생성 도우미 ---------- */
function mkStudent(r,id,role,female){const f=female==null?r()<.5:female;return {id,name:pickr(r,SUR)+pickr(r,f?KG:KB),female:f,adult:false,kind:'k',seed:Math.floor(r()*1e6),hairStyle:Math.floor(r()*(f?4:3)),role}}
function mkParent(r,id,child,role){const f=r()<.65;const p={id,name:(f?pickr(r,SUR):child.name[0])+pickr(r,f?AG:AB),female:f,adult:true,kind:'p',seed:child.seed+3,hairStyle:Math.floor(r()*(f?4:3)),beard:!f&&r()<.5,role,hair:HAIRC[child.seed%HAIRC.length]};return p}
function mkAdult(r,id,role,kind,opt){const f=opt&&opt.female!=null?opt.female:r()<.6;return {id,name:pickr(r,SUR)+pickr(r,f?AG:AB),female:f,adult:true,kind:kind||'t',seed:Math.floor(r()*1e6),hairStyle:Math.floor(r()*(f?4:3)),glasses:r()<.4,older:!!(opt&&opt.older),role,...(opt||{})}}

  sheet(c,id){const ch=c.chars,V=c.V;return {

    const order=spec.order||[].concat(Object.keys(c.chars).filter(id=>!c.chars[id].adult&&!/^(PP|SP|SP2)$/.test(id)),['PP','SP','SP2'],Object.keys(c.chars).filter(id=>c.chars[id].adult&&!/^(PP|SP|SP2)$/.test(id)));const nc={};order.forEach(id=>{if(c.chars[id])nc[id]=c.chars[id]});Object.keys(c.chars).forEach(id=>{if(!nc[id])nc[id]=c.chars[id]});c.chars=nc;

       {k:'money',t:'돈을 가져갔니?',fx:{clue:'c_no_money'},r:{first:`아니요. 무서워서 그다음부터 엄마랑 갔어요.`}},

       {k:'safe',t:'네 이름은 나오지 않을 거야. 들은 게 있니?',hard:50,fx:{clue:'c_w_saw',clue2:'c_threat',trust:+3,turn:true},r:{first:`…"안 가져오면 맞는다"요. 두 번 다 들었어요.`}}],
    T:[{k:'obs',t:`${n.P}이(가) 어땠나요?`,fx:{},ev:'ev_t',r:{first:`하교 종 치면 화장실에 숨어 있어요. 제가 물어서야 말했어요.`}},
       {k:'sep',t:'하교 시간 분리와 동행 안내를 부탁드립니다.',fx:{trust:+2},r:{first:`네. 4학년은 6학년보다 10분 먼저 보낼게요.`}}],

  issues:[{k:'i1',label:'협박·강요가 있었다',hint:(c,sp)=>sp.i1?'경비원·CCTV·목격·자백':'"장난" 주장을 반박할 근거 없음'},{k:'i2',label:'반복 (2회)',hint:(c,sp)=>sp.i2?'횟수 확인':'미확인'},{k:'i3',label:'실제 금품 피해가 있었다',hint:(c,sp)=>sp.i3?'돈을 주지 않은 것으로 확인':'미확인'}],

  truth:{issues:{i1:'y',i2:'y',i3:'n'},judge:{sev:1,per:1,intent:2,rem:1,rec:2}},remClue:'c_s_sorry',

  lies:c=>{const n=N(c),cl=c.clues,V=c.V,L=[{who:n.S,what:'"장난"',found:!!cl.c_s_confess}];if(V==='w_fear')L.push({who:n.W,what:'들었으면서 "못 들었다"',found:!!cl.c_w_saw});if(V==='pp_exag')L.push({who:n.PP,what:'돈을 빼앗긴 것처럼 과장',found:!!cl.c_no_money});return L},

let SCREEN='home';let LAST_SCREEN=null;const HIST=[];let PARAM=null;
function go(s,p,noHist){if(!noHist&&SCREEN&&(SCREEN!==s||PARAM!==p)){snd('page');HIST.push([SCREEN,PARAM]);if(HIST.length>30)HIST.shift();try{history.pushState({s},'')}catch(e){}}SCREEN=s;PARAM=p;render(p)}
function back(){if(!HIST.length)return;const [s,p]=HIST.pop();SCREEN=s;PARAM=p;render(p)}

function dueRows(cx){
  const c=cx||G.case,R=[];const ch=c.chars;
  const d=cd(c);
  if(!c.reported)R.push([c.rcPending?'보고 카드 결재 중 (교감·교장)':'교육지원청 48시간 보고',c.rcPending?`내일 결재 결과 — 반려되면 다시 올려야 합니다 · 기한 ${fmtS(c.dates.rep)}`:`${fmtS(c.dates.rep)} 18:00까지`,d>=2?'red':'amber',d>2?'기한 초과':d===2?'오늘':`D+${2-d}`]);
  if(!c.notified.P||!c.notified.S)R.push(['보호자 사안 통보',`${!c.notified.P?'피해추정 측 ':''}${!c.notified.S?'가해추정 측':''} 미통보 — 하루 늦을수록 민원 위험`,'amber','즉시']);
  if((c.notified.P&&!c.record.P)||(c.notified.S&&!c.record.S))R.push(['통보 기록 보완','전화 통보는 기록이 없습니다 — 문자로 남기세요','amber','무료']);

function qrSvg(text){try{const q=qrcode(0,'M');q.addData(text);q.make();return q.createSvgTag({cellSize:4,margin:2,scalable:true})}catch(e){return '<div class="note">QR 생성 실패</div>'}}
function makeTeachCode(){const id=$('#tc-arch').value;const seed=Math.floor(Math.random()*1e9);const r=rng(mix(seed+7));let d=new Date(2026,Math.floor(r()*12),1+Math.floor(r()*27));while(d.getDay()===0||d.getDay()===6)d=addDays(d,1);TEACH.code=`SA1-${id}-${seed}-${d.getFullYear()}${pad2(d.getMonth()+1)}${pad2(d.getDate())}`;render()}
async function scanResultQr(){
  if(!('BarcodeDetector' in window))return toast('이 브라우저는 앱 안 스캔을 지원하지 않습니다. 카메라 앱으로 찍어 주세요.');
  let stream;try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}})}catch(e){return toast('카메라를 열 수 없습니다.')}
  const det=new BarcodeDetector({formats:['qr_code']});const seen=new Set();
  ask('QR 스캔 중',`<video id="scanv" autoplay playsinline style="width:100%;border-radius:8px;background:#000"></video><div class="note" id="scann">참가자 QR을 화면에 맞추세요. 여러 장 연속으로 찍힙니다.</div>`,[{t:'그만',f:()=>{stream.getTracks().forEach(t=>t.stop());render()}}]);
  const v=$('#scanv');v.srcObject=stream;let n=0;
  const loop=async()=>{if(!$('#modal').classList.contains('on')){stream.getTracks().forEach(t=>t.stop());return}
    try{const codes=await det.detect(v);for(const cde of codes){let s=cde.rawValue||'';try{const url=new URL(s);s=url.searchParams.get('result')||s}catch(e){}const o=parseResult(s);if(o&&!seen.has(s)){seen.add(s);TEACH.results=TEACH.results.concat([o]);n++;snd('ok');$('#scann').textContent=`${n}건 추가 — ${o.n} ${o.g} ${o.s}점`}}}catch(e){}
    setTimeout(loop,400)};
  v.onloadedmetadata=()=>loop();
}
function collectResults(){const t=$('#tc-in').value;let n=0;t.split(/\s+/).forEach(s=>{const o=parseResult(s);if(o){TEACH.results.push(o);n++}});toast(n?`${n}건 추가했습니다.`:'읽을 수 있는 결과 코드가 없습니다.');render()}
function copyTable(){const rows=TEACH.results.slice().sort((a,b)=>b.s-a.s);const t='순위,이름,등급,점수,결과,D+,거짓말,놓침,절차\n'+rows.map((r,i)=>[i+1,r.n,r.g,r.s,r.r,r.d,r.l,r.m,r.p].join(',')).join('\n');copyText(t)}

function calHtml(){
  const c=G.case,t=today();const y=t.getFullYear(),m=t.getMonth();const first=new Date(y,m,1);const last=new Date(y,m+1,0);

  put(G.start,'접수');put(c.dates.rep,'48h',c.reported?'':'red');put(c.dates.inv,'조사마감');put(c.dates.rev,'심의위');
  G.inbox.forEach(mm=>{const d=addDays(G.start,mm.day);if(mm.kind==='문자'||mm.kind==='공문')put(d,mm.kind)});
  let h='';for(let i=0;i<first.getDay();i++)h+='<div></div>';
  for(let d=1;d<=last.getDate();d++){const dt=new Date(y,m,d);const wk=dt.getDay()===0||dt.getDay()===6;const isT=d===t.getDate();const mk=marks[d]||[];h+=`<div class="d ${isT?'today':''} ${wk?'wk':''} ${mk.length?'m':''}">${d}${mk.slice(0,2).map(([l,cl])=>`<small class="${cl}">${l}</small>`).join('')}</div>`}
  const [sg,sd]=season(m+1);

function relationSvg(){
  const c=G.case,ch=c.chars;const ids=Object.keys(ch);const n=ids.length;const cx=185,cy=88,rx=150,ry=62;const pos={};
  ids.forEach((id,i)=>{const ang=-Math.PI/2+i*2*Math.PI/n;pos[id]=[cx+rx*Math.cos(ang),cy+ry*Math.sin(ang)]});
  const link=(a,b,lb,dash)=>{if(!pos[a]||!pos[b])return '';const [x1,y1]=pos[a],[x2,y2]=pos[b];return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="var(--line)" stroke-width="2" ${dash?'stroke-dasharray="4 3"':''}/><text x="${(x1+x2)/2}" y="${(y1+y2)/2-4}" font-size="9" fill="var(--ink2)" text-anchor="middle">${lb}</text>`};
  const node=id=>{const [x,y]=pos[id];return `<g><circle cx="${x}" cy="${y}" r="16" fill="var(--surface2)" stroke="${nameColor(id)}" stroke-width="2.5"/><text x="${x}" y="${y+4}" font-size="9" text-anchor="middle" fill="${nameColor(id)}" font-weight="700">${ch[id].name.slice(0,4)}</text></g>`};
  const E=[['P','PP','가족'],['S','SP','가족'],['S2','SP2','가족'],['P','S','당사자',1],['S2','S','동조',1],['W','P','목격',1],['T','P','담임',1],['T','S',ch.T2?'':'담임',1],['T2','S','담임',1],['CK','S','목격',1],['EX','S','목격',1],['OT','S','상대 학교',1]];
  return `<svg viewBox="0 0 370 176" style="width:100%;height:auto;display:block;font-family:inherit">${E.filter(e=>ch[e[0]]&&ch[e[1]]&&e[2]!=='').map(e=>link(e[0],e[1],e[2],e[3])).join('')}${ids.map(node).join('')}</svg>`;
}

  <li><div class="grow"><div class="t">순화 모드</div><div class="s">욕설을 ○○으로 가립니다</div></div><div class="seg"><button class="${!D.clean?'on':''}" onclick="SD.clean=false;render()">끔</button><button class="${D.clean?'on':''}" onclick="SD.clean=true;render()">켬</button></div></li>
  <li><div class="grow"><div class="t">연수 모드</div><div class="s">병가 없이 끝까지</div></div><div class="seg"><button class="${!D.training?'on':''}" onclick="SD.training=false;render()">끔</button><button class="${D.training?'on':''}" onclick="SD.training=true;render()">켬</button></div></li>
  <li><div class="grow"><div class="t">소리</div><div class="row" style="margin-top:6px"><span class="no">음량</span><input type="range" min="0" max="1" step="0.1" value="${D.vol}" style="width:120px" oninput="SD.vol=+this.value"></div></div><div class="seg"><button class="${D.sound?'on':''}" onclick="SD.sound=true;render()">켬</button><button class="${!D.sound?'on':''}" onclick="SD.sound=false;render()">끔</button></div></li>
  <li><div class="grow"><div class="t">학교 규모</div><div class="s">사건 빈도·동시 진행·지원 인력이 달라집니다(새 시즌부터)</div></div><div class="seg">${[['small','읍면 소규모'],['mid','중규모'],['large','대규모']].map(([k,l])=>`<button class="${D.school===k?'on':''}" onclick="SD.school='${k}';render()">${l}</button>`).join('')}</div></li>
  <li><div class="grow"><div class="t">난이도 (5단계)</div><div class="s">${DIFF_ORDER.map(k=>`${DIFFS[k].name}: 슬롯 ${DIFFS[k].slots}·48시간 ${DIFFS[k].late48}일·조사 ${DIFFS[k].reportDue}일·이관 ${DIFFS[k].transferN}건·감점 ${Math.round(DIFFS[k].penMul*100)}%${DIFFS[k].hints?'·힌트':''}${DIFFS[k].noGameOver?'·해제 없음':''}${DIFFS[k].x2Second?'·이벤트 2회':''}`).join(' / ')}. 평일은 수업 시수만큼 빠짐. 새 날부터 적용</div></div><div class="seg">${DIFF_ORDER.map(k=>`<button class="${D.difficulty===k?'on':''}" onclick="SD.difficulty='${k}';if(DIFFS['${k}'].hints)SD.hints=true;render()">${DIFFS[k].name} ${DIFFS[k].slots}</button>`).join('')}</div></li>
  <li><div class="grow"><div class="t">동시 진행 사건</div><div class="s">기한이 겹치는 압박. 새 사건은 며칠 간격으로 들어옵니다</div></div><div class="seg">${[1,2,3].map(n=>`<button class="${D.maxActive===n?'on':''}" onclick="SD.maxActive=${n};render()">${n}건</button>`).join('')}</div></li>
  <li><div class="grow"><div class="t">시즌 길이</div></div><div class="seg">${[[5,'5'],[10,'10'],[20,'20'],[999,'무한']].map(([n,l])=>`<button class="${D.seasonN===n?'on':''}" onclick="SD.seasonN=${n};render()">${l}</button>`).join('')}</div></li>
  <li><div class="grow"><div class="t">저장 코드</div></div><div class="btns"><button class="btn sm" onclick="exportCode()">내보내기</button><button class="btn sm" onclick="importCode()">불러오기</button></div></li>
  <li><div class="grow"><div class="t">버전</div><div class="s">v${VERSION} — 버전 기록은 더보기 → 「만든이」</div></div></li>
  <li><div class="grow"><div class="t">진행 초기화</div><div class="s">현재 사건을 버리고 처음으로</div></div><button class="btn sm" onclick="ask('초기화','현재 사건 진행을 지웁니다. 보관함은 유지됩니다.',[{t:'지우기',f:()=>{G=null;save();render()}},{t:'취소',f:()=>{}}])">초기화</button></li>
  </ul><div class="bd btns" style="border-top:1px solid var(--line2)"><button class="btn primary" onclick="applySettings()">적용</button><button class="btn" onclick="SD=null;render()">되돌리기</button>${settingsDirty()?'<span class="note" style="margin:0;align-self:center">적용하지 않은 변경이 있습니다</span>':''}</div></div>`;
}
function showChangelog(){ask('버전 기록',`<div style="font-size:13px">${CHANGELOG.map(([v,d])=>`<div style="padding:4px 0;border-bottom:1px solid var(--line2)"><b>v${v}</b> — ${d}</div>`).join('')}</div>`,[{t:'닫기',f:()=>{}}])}
function settingsDirty(){if(!SD)return false;return SD.noDaySummary!==!!DEF.noDaySummary||SD.school!==(DEF.school||'mid')||SD.difficulty!==(DEF.difficulty||'normal')||SD.hints!==!!DEF.hints||SD.maxActive!==(DEF.maxActive||2)||JSON.stringify(SD.ai)!==JSON.stringify({...DEF.ai})||SD.sound!==(DEF.sound!==false)||SD.vol!==(DEF.vol??0.6)||SD.seasonN!==(DEF.seasonN||10)||SD.theme!==DEF.theme||SD.style!==DEF.style||SD.clean!==DEF.clean||SD.training!==DEF.training||SD.hpos!==(DEF.hpos||'top')||SD.font!==(DEF.font||'noto')}
function applySettings(){if(!SD)return;Object.assign(DEF,{ai:{...SD.ai},theme:SD.theme,style:SD.style,styleUser:true,clean:SD.clean,training:SD.training,hpos:SD.hpos,font:SD.font,seasonN:SD.seasonN,maxActive:SD.maxActive,sound:SD.sound,vol:SD.vol,hints:SD.hints,difficulty:SD.difficulty,school:SD.school,noDaySummary:SD.noDaySummary});applyPrefs();save();SD=null;toast('설정을 적용했습니다.'+(aiReady()?' AI 기능이 켜졌습니다.':''));snd('ok');render()}
document.addEventListener('click',e=>{const b=e.target.closest('.themes button');if(b&&b.dataset.t){if(SCREEN==='settings'&&G&&SD){SD.theme=b.dataset.t;render()}else{setTheme(b.dataset.t);render()}}});

/* ---------- 소리 ---------- */
let AC=null;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function tone(f,t0,dur,type,g0){const a=ac();if(!a)return;const o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,a.currentTime+t0);g.gain.setValueAtTime(0,a.currentTime+t0);g.gain.linearRampToValueAtTime(g0,a.currentTime+t0+0.01);g.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+t0+dur);o.connect(g);g.connect(a.destination);o.start(a.currentTime+t0);o.stop(a.currentTime+t0+dur+0.02)}
function noise(t0,dur,g0,hp){const a=ac();if(!a)return;const n=a.sampleRate*dur,b=a.createBuffer(1,n,a.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);const src=a.createBufferSource();src.buffer=b;const f=a.createBiquadFilter();f.type=hp?'highpass':'lowpass';f.frequency.value=hp?1800:900;const g=a.createGain();g.gain.value=g0;src.connect(f);f.connect(g);g.connect(a.destination);src.start(a.currentTime+t0)}
function snd(name){if(DEF.sound===false)return;const v=(DEF.vol??0.6);if(!v)return;
  switch(name){case 'click':tone(1200,0,0.04,'square',0.05*v);break;case 'mail':tone(880,0,0.12,'sine',0.18*v);tone(1318,0.12,0.18,'sine',0.16*v);break;case 'day':noise(0,0.18,0.25*v,true);tone(520,0.05,0.08,'triangle',0.06*v);break;case 'alert':tone(220,0,0.16,'sawtooth',0.12*v);tone(196,0.18,0.22,'sawtooth',0.12*v);break;case 'ok':[523,659,784].forEach((f,i)=>tone(f,i*0.09,0.22,'triangle',0.14*v));break;case 'bad':[440,370,311].forEach((f,i)=>tone(f,i*0.12,0.26,'triangle',0.13*v));break;case 'stamp':noise(0,0.08,0.35*v,false);tone(120,0,0.12,'sine',0.25*v);break;case 'refuse':tone(330,0,0.1,'square',0.06*v);tone(262,0.1,0.14,'square',0.06*v);break;case 'phone':[0,0.28].forEach(t0=>{tone(880,t0,0.09,'sine',0.12*v);tone(1046,t0+0.1,0.09,'sine',0.12*v)});break;case 'bell':tone(1568,0,0.25,'sine',0.14*v);tone(2093,0.04,0.35,'sine',0.08*v);tone(1568,0.4,0.3,'sine',0.1*v);break;case 'gavel':noise(0,0.05,0.4*v,false);tone(160,0,0.09,'sine',0.3*v);noise(0.16,0.05,0.35*v,false);tone(160,0.16,0.09,'sine',0.26*v);break;case 'page':noise(0,0.06,0.08*v,true);break}}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(b&&!b.disabled)snd('click')},true);

/* ---------- 모달·토스트·팝업·맞춤 ---------- */
function hidePop(){const w=$('#popwrap');if(w.classList.contains('on')){w.classList.remove('on');w.style.display='none'}}
function ask(title,html,opts){hidePop();const noSlot=!!(G&&G.slots<=0);$('#mbox').innerHTML=kp(`<h3>${esc(title)}</h3><div style="font-size:14px">${html}</div>`)+`<div class="opts">${opts.map((o,i)=>{const dis=o.disabled||(o.slot&&noSlot);return `<button class="btn ${i===0&&!dis?'primary':''}" data-i="${i}" ${dis?'disabled':''}>${esc(o.t)}${o.slot&&noSlot?' <span class="chip red">슬롯 없음</span>':''}${o.s?`<small>${esc(o.s)}</small>`:''}</button>`}).join('')}</div>`;colorizeNames($('#mbox'));$('#modal').classList.add('on');document.querySelectorAll('#mbox [data-i]').forEach(b=>b.onclick=()=>{if(b.disabled)return;$('#modal').classList.remove('on');opts[+b.dataset.i].f();showPending()})}
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')e.target.classList.remove('on')});
const TQ=[];let TBUSY=false;
function toast(t){TQ.push(t);if(!TBUSY)_toastNext()}
function _toastNext(){const el=$('#toast');if(!TQ.length){TBUSY=false;el.style.display='none';return}TBUSY=true;el.textContent=kp(TQ.shift());el.style.display='block';setTimeout(()=>{el.style.display='none';setTimeout(_toastNext,220)},2200)}
function showPending(){if(!G||!G.pending||!G.pending.length)return;if($('#modal').classList.contains('on'))return;if($('#popwrap').classList.contains('on'))return;
  const id=G.pending[0];const m=G.inbox.find(x=>x.id===id);if(!m){G.pending.shift();return showPending()}
  const rest=G.pending.length-1;const el=$('#pop');
  const acts=mailActions(m).map((a,i)=>`<button class="btn primary sm" onclick="closePop();(${a.f.toString()})()">${a.t}</button>`);
  const primary=mailActions(m);
  el.innerHTML=`<button class="x" onclick="closePop(true)" aria-label="닫기">×</button><div class="t">📨 새 소식${rest?` (${rest+1}건 중 1)`:''}</div><div class="meta"><span class="chip ${m.kind==='문자'?'red':m.kind==='공문'?'seal':m.kind==='117'?'green':''}">${m.kind}</span> ${esc(m.fromLabel)} · ${m.day===G.day?'오늘':fmtS(addDays(G.start,m.day))}</div><div class="body">${esc(cleanText(m.body))}</div><div class="btns">${primary.map((a,i)=>`<button class="btn primary sm" data-pa="${i}">${a.t}</button>`).join('')}${primary.length?'':`<button class="btn sm" onclick="closePop();go('inbox')">편지함</button>`}<button class="btn sm" onclick="closePop(true)">${rest?`읽음 · 다음 (${rest})`:'읽음'}</button></div>`;
  el.querySelectorAll('[data-pa]').forEach(b=>b.onclick=()=>{closePop();primary[+b.dataset.pa].f()});
  colorizeNames(el);m.read=true;snd('mail');const w=$('#popwrap');w.style.display='flex';requestAnimationFrame(()=>w.classList.add('on'));save()}
function closePop(next){const w=$('#popwrap');w.classList.remove('on');if(G&&G.pending)G.pending.shift();setTimeout(()=>{w.style.display='none';if(next)showPending()},260)}
$('#popwrap').addEventListener('click',e=>{if(e.target.id==='popwrap')closePop(true)});
function fit(){/* v1.4.2: 자동 축소 없음 — 글자 크기 고정, 세로 스크롤 */}
window.addEventListener('resize',()=>fit());if(window.visualViewport)window.visualViewport.addEventListener('resize',()=>fit());window.addEventListener('orientationchange',()=>setTimeout(fit,200));

/* ---------- PC 키보드 단축키 ---------- */
document.addEventListener('keydown',e=>{if(!G||!isDesktop())return;const tag=(e.target.tagName||'').toLowerCase();if(tag==='input'||tag==='textarea'||tag==='select')return;if(e.metaKey||e.ctrlKey||e.altKey)return;
  if(e.key==='Escape'){if($('#modal').classList.contains('on'))$('#modal').classList.remove('on');else if($('#popwrap').classList.contains('on'))closePop(true);else if(MAILVIEW){MAILVIEW=null;render()}return}
  if($('#modal').classList.contains('on')){const n=parseInt(e.key);if(n>=1&&n<=9){const b=[...document.querySelectorAll('#mbox [data-i]')].filter(x=>!x.disabled)[n-1];if(b)b.click()}return}
  if(SCREEN==='interview'){const n=parseInt(e.key);if(n>=1&&n<=6){askQ(n-1);return}}
  const map={n:()=>nextDay(),w:()=>go('week'),h:()=>go('home'),i:()=>go('inbox'),c:()=>go('case'),p:()=>go('people'),e:()=>go('evidence'),r:()=>go('report'),b:()=>go('board'),k:()=>go('notebook'),'?':()=>showHelp()};
  const f=map[e.key.toLowerCase()]||map[e.key];if(f){e.preventDefault();f()}
  if(e.key==='Tab'&&G.cases.filter(x=>!x.done).length>1){e.preventDefault();const act=G.cases.filter(x=>!x.done);const i=act.indexOf(G.case);selectCase(act[(i+1)%act.length].no);render()}
});
/* ---------- 부팅 ---------- */
load();applyPrefs();render();
(function(){try{const rq=new URLSearchParams(location.search).get('result');if(rq){const o=parseResult(rq);if(o){TEACH.results=TEACH.results.concat([o]);toast(`결과 추가: ${o.n} ${o.g} ${o.s}점`);history.replaceState({},'',location.pathname);SCREEN='teach';render();return}}const q=new URLSearchParams(location.search).get('code');if(!q)return;const code=q.trim().toUpperCase();if(G&&G.shared===code){return}if(G&&G.cases&&G.cases.some(x=>!x.done)){ask('강사 코드로 시작','진행 중인 사건이 있습니다. 이 코드의 사건으로 새로 시작할까요? (보관함은 유지)',[{t:'새로 시작',f:()=>startFromCode(code)},{t:'취소',f:()=>{}}])}else startFromCode(code);history.replaceState({},'',location.pathname)}catch(e){}})();
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){navigator.serviceWorker.register('sw.js').catch(()=>{})}
</script>
